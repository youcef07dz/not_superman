<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>إيجيس</title>
<style>
html,body{margin:0;height:100%;background:#07122e;color:#f3f6ff;font-family:'Barlow Condensed','Segoe UI',Tahoma,'Arial Narrow',Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;box-sizing:border-box}
h1{margin:0 0 6px;font-size:clamp(52px,14vw,120px);line-height:.9;color:#ffcc33;text-shadow:5px 5px 0 #d9262c;letter-spacing:.02em}
p{margin:0;font-size:16px;opacity:.7}
a{color:#ffcc33;font-weight:700;font-size:18px;text-decoration:none;border:2px solid #ffcc33;border-radius:4px;padding:10px 22px}
a:hover,a:focus-visible{background:#ffcc33;color:#07122e;outline:2px solid #d9262c}
</style>
</head>
<body>
<h1>إيجيس</h1>
<p id="msg">اختر نسختك…</p>
<a id="mb" href="mobile.html">نسخة الهاتف</a>
<a id="pc" href="pc.html">نسخة الحاسوب</a>
<script>
(function(){
 var touch = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0;
 var ua = /Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent);
 var mobile = touch || ua;
 location.replace(mobile ? 'mobile.html' : 'pc.html');
})();
</script>
</body>
</html>
